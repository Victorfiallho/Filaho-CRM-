name: Scrape Muses Cabinets catalog

on:
  schedule:
    # Mondays 09:00 UTC (~05:00/06:00 ET depending on DST)
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/scrape-muses.mjs
        env:
          MUSE_ACCOUNT: ${{ secrets.MUSE_ACCOUNT }}
          MUSE_PASSWORD: ${{ secrets.MUSE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
